<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Launchpad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
</head>
<body class="open-sans-raleway">
    <!-- ==== NAVBAR ==== -->
    <header class="header"> 
        <nav class="nav-bar">
            <h3 class="nav-logo">LOGO</h3>
            <button class="btn-nav">Sign Up</button>
        </nav>
        <!-- ==== HERO SECTION ==== -->
        <section class="hero">
            <h1 class="hero-h1">Cool Dark UI Template for <br> Webflow Agencies!</h1>
            <button class="btn-hero">Stay Focused</button>
        </section>
    </header>
    <main>
        <!-- ==== SEE IT IN ACTION ==== -->
          
        <section class="see-action">
            <div class="see-action-text">
                <h2 class="action-h2">See It in Action</h2>
                <p class="action-p">Explore the live preview and imagine your<br>brand in this bold new look.</p>
                <button class="btn-launch">Launch Live Preview</button>
            </div>

            <!-- Image for See it in Action -->
            <img src="/Assets/wc-mini.png" alt="Webflow Conf 2022" class="see-action-img" />
        </section>

          <!-- ==== STATS SECTION ==== -->
        <section class="stats">
            <h2 class="h2-stats">Joined Thousands of Productive Users</h2>

            <div class ="div-stats">
                <p>50K+<br> Active Users</p>
                <p>2M+<br> Final Sections</p>
                <p>95%<br> Satisfaction Rate</p>
            </div>

        </section>


    </main>

    <footer>

    </footer>
</body>
</html>
